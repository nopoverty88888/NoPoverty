name: Keep Supabase Alive
on:
  schedule:
    - cron: '0 12 */5 * *'   # every 5 days at 12:00 UTC
  workflow_dispatch:           # also runnable manually

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (Auth health)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Fail fast with a clear message if a secret is missing/empty
          # (the old workflow silently pinged a hostless URL for months).
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL or SUPABASE_ANON_KEY secret is missing/empty"
            exit 1
          fi
          # NOTE: do NOT ping /rest/v1/?select=* — that root is service_role-only,
          # and our anon role has no table grants (auth is via the authenticated
          # role + RLS), so REST returns 401 for the anon key. The GoTrue auth
          # health endpoint returns 200 for any valid apikey through the gateway
          # and keeps the project's API active, which is all we need.
          code=$(curl --show-error --silent --location \
            -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/auth/v1/health")
          echo "Supabase /auth/v1/health -> HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Unexpected status $code from Supabase keep-alive ping"
            exit 1
          fi
